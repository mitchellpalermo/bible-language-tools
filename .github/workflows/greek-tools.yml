name: greek-tools

on:
  push:
    branches: [main]
    paths:
      - 'apps/greek-tools/**'
      - 'packages/shared/**'
      - 'packages/db/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
  pull_request:
    paths:
      - 'apps/greek-tools/**'
      - 'packages/shared/**'
      - 'packages/db/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter @tools/shared test:coverage
      - run: pnpm --filter @tools/shared typecheck
      - run: pnpm --filter @tools/db test:run
      - run: pnpm --filter @tools/db typecheck
      # The paradigm ladder's forms are looked up in the Greek New Testament
      # (src/data/paradigm-ladder.test.ts). Without the corpus those checks skip,
      # and src/test/corpus.test.ts fails when CI has none, so this step cannot
      # be dropped quietly.
      - run: pnpm --filter greek-tools exec node scripts/build-morphgnt.mjs
      - run: pnpm --filter greek-tools test:run
      - run: pnpm --filter greek-tools typecheck

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/greek-tools
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm build
        env:
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST }}
      - name: Set Cloudflare Worker secrets
        run: |
          echo "${{ secrets.BETTER_AUTH_SECRET }}" | pnpm wrangler secret put BETTER_AUTH_SECRET
          echo "${{ secrets.GOOGLE_CLIENT_ID }}" | pnpm wrangler secret put GOOGLE_CLIENT_ID
          echo "${{ secrets.GOOGLE_CLIENT_SECRET }}" | pnpm wrangler secret put GOOGLE_CLIENT_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Sign in with Apple is optional: a secret left unset in GitHub is skipped,
      # so the app keeps Apple off (or keeps whatever was set on the Worker by hand).
      # Values go through env rather than being pasted into the script, since the .p8 key is
      # several lines long.
      - name: Set Sign in with Apple secrets
        run: |
          for name in APPLE_CLIENT_ID APPLE_TEAM_ID APPLE_KEY_ID APPLE_PRIVATE_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | pnpm wrangler secret put "$name"
            else
              echo "$name not set; skipping"
            fi
          done
        env:
          APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply D1 migrations
        run: pnpm wrangler d1 migrations apply bible-language-tools --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to Cloudflare Workers
        run: pnpm wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
